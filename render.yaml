services:
  - type: web
    name: jubileejive
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: jubileejive.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: PORT
        value: 10000 